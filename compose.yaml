services:
  app:
    build: .
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:-learning_platform}
      PGUSER: learning_app
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      ENABLE_DEMO_LOGIN: ${ENABLE_DEMO_LOGIN:-false}
      APP_BIND_ADDRESS: ${APP_BIND_ADDRESS:-127.0.0.1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      DEMO_TEACHER_EMAIL: ${DEMO_TEACHER_EMAIL:-}
      DEMO_TEACHER_PASSWORD: ${DEMO_TEACHER_PASSWORD:-}
      DEMO_STUDENT_ONE_EMAIL: ${DEMO_STUDENT_ONE_EMAIL:-}
      DEMO_STUDENT_ONE_PASSWORD: ${DEMO_STUDENT_ONE_PASSWORD:-}
      DEMO_STUDENT_TWO_EMAIL: ${DEMO_STUDENT_TWO_EMAIL:-}
      DEMO_STUDENT_TWO_PASSWORD: ${DEMO_STUDENT_TWO_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${PGDATABASE:-learning_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U postgres -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  postgres_data:
